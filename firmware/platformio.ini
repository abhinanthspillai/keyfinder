[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson

[env:native]
platform = native
build_flags =
    -Iinclude
    -Ilib/ClapDetector
    -Ilib/RingPattern
    -Ilib/ButtonHandler
lib_deps =
    bblanchon/ArduinoJson
    throwtheswitch/Unity
